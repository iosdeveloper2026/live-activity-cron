name: Live Activity cron

on:
  schedule:
    - cron: "*/5 * * * *" # every ~5 minutes (GitHub's minimum); runs can be late
  workflow_dispatch: # "Run workflow" button for testing

permissions:
  contents: read

concurrency:
  group: live-activity-cron
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/send-live-activity.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Start a fresh Live Activity every N minutes. Override with the repo variable
          # REPEAT_EVERY_MINUTES (Settings -> Secrets and variables -> Actions -> Variables).
          REPEAT_EVERY_MINUTES: ${{ vars.REPEAT_EVERY_MINUTES || '30' }}
          # Swift type name of the app's ActivityAttributes (LiveActivityKit: LiveActivityAttributes).
          ATTRIBUTES_TYPE: ${{ vars.ATTRIBUTES_TYPE || 'LiveActivityAttributes' }}
